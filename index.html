<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RIVALS WEB FPS</title>

<style>
*{box-sizing:border-box;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;font-family:Arial,"Microsoft JhengHei",sans-serif}
#game{width:100vw;height:100vh}

.hidden{display:none!important}

/* ================= MENU ================= */

#menu{
 position:fixed;inset:0;z-index:100;
 background:
 linear-gradient(90deg,rgba(0,0,0,.86),rgba(0,0,0,.25),rgba(0,0,0,.7)),
 url("https://sm.ign.com/ign_za/cover/r/rivals-rob/rivals-roblox_2s2w.jpg") center/cover no-repeat;
 display:flex;align-items:center;padding-left:8%;
}

.menuBox{width:430px;color:white}
.logo{
 font-size:72px;font-weight:1000;letter-spacing:7px;font-style:italic;
 text-shadow:4px 4px 0 #000,0 0 25px rgba(255,255,255,.3)
}
.subtitle{margin:-8px 0 35px;color:#ccc;letter-spacing:5px}

.menuButton{
 width:310px;display:block;margin:13px 0;padding:16px 22px;
 border:1px solid rgba(255,255,255,.35);
 background:rgba(0,0,0,.58);color:white;
 font-size:21px;font-weight:bold;text-align:left;
 cursor:pointer;transition:.15s
}
.menuButton:hover{background:white;color:black;transform:translateX(8px)}
.version{margin-top:40px;color:#999;font-size:13px}

/* ================= ARSENAL ================= */

#arsenal{
 position:fixed;inset:0;z-index:150;
 background:
 linear-gradient(rgba(5,8,14,.92),rgba(5,8,14,.97)),
 url("https://sm.ign.com/ign_za/cover/r/rivals-rob/rivals-roblox_2s2w.jpg") center/cover;
 color:white;padding:45px 6%;
 overflow:auto;
}

.arsenalTop{
 display:flex;align-items:center;justify-content:space-between;
 border-bottom:1px solid #444;padding-bottom:20px
}

.arsenalTitle{font-size:46px;font-weight:900;letter-spacing:3px}
.backButton{
 background:rgba(255,255,255,.08);border:1px solid #666;
 color:white;padding:12px 24px;font-size:17px;cursor:pointer
}
.backButton:hover{background:white;color:black}

.weaponGrid{
 display:grid;
 grid-template-columns:repeat(3,minmax(180px,1fr));
 gap:22px;margin-top:35px;max-width:1100px
}

.weaponCard{
 min-height:420px;padding:25px;
 background:rgba(10,14,23,.82);
 border:1px solid #3d4656;
 cursor:pointer;transition:.18s;
 position:relative
}
.weaponCard:hover{transform:translateY(-5px);border-color:white}
.weaponCard.selected{border:2px solid #fff;box-shadow:0 0 25px rgba(255,255,255,.12)}

.weaponIcon{
 height:170px;
 display:flex;align-items:center;justify-content:center;
 font-size:90px;
 filter:drop-shadow(0 10px 10px rgba(0,0,0,.6))
}

.weaponCard h2{margin:5px 0;font-size:28px}
.weaponType{color:#999;margin-bottom:20px}

.stat{margin:12px 0}
.statName{display:flex;justify-content:space-between;font-size:13px;color:#bbb}
.statBar{height:6px;background:#252a32;margin-top:5px}
.statFill{height:100%;background:white}

.equip{
 width:100%;margin-top:18px;padding:12px;
 background:white;color:black;border:0;
 font-weight:bold;font-size:16px;cursor:pointer
}
.equip:hover{background:#ccc}
.equipped{
 background:#222;color:#fff;cursor:default
}

#equippedText{
 margin-top:25px;color:#aaa;font-size:15px
}

/* ================= HUD ================= */

#hud{
 position:fixed;inset:0;pointer-events:none;z-index:20;color:white
}
#crosshair{
 position:absolute;left:50%;top:50%;
 width:22px;height:22px;transform:translate(-50%,-50%)
}
#crosshair:before,#crosshair:after{
 content:"";position:absolute;background:white;box-shadow:0 0 5px black
}
#crosshair:before{width:2px;height:22px;left:10px}
#crosshair:after{width:22px;height:2px;top:10px}

#topbar{
 position:absolute;top:18px;left:50%;
 transform:translateX(-50%);
 padding:10px 22px;background:rgba(0,0,0,.6);
 border:1px solid rgba(255,255,255,.25);border-radius:10px
}

#healthBox{position:absolute;left:25px;bottom:25px;width:260px}
#healthText{font-size:18px;margin-bottom:7px;font-weight:bold}
#healthBar{height:17px;background:#111;border:1px solid white;border-radius:8px;overflow:hidden}
#healthFill{height:100%;width:100%;background:#28df70}

#ammo{position:absolute;right:30px;bottom:25px;text-align:right}
#weaponName{font-size:18px}
#ammoNumber{font-size:46px;font-weight:bold}

#message{
 position:absolute;top:64%;left:50%;
 transform:translateX(-50%);
 font-size:24px;font-weight:bold;text-shadow:0 2px 5px black
}

#hitmarker{
 position:absolute;top:50%;left:50%;
 transform:translate(-50%,-50%);
 font-size:28px;opacity:0
}

#damageFlash{
 position:fixed;inset:0;background:rgba(255,0,0,.4);
 opacity:0;pointer-events:none;z-index:50
}

/* ================= END ================= */

#endScreen{
 position:fixed;inset:0;z-index:200;
 background:rgba(0,0,0,.85);
 display:flex;justify-content:center;align-items:center;
 color:white;text-align:center
}
.endBox{
 width:450px;padding:45px;
 background:rgba(10,10,15,.96);border:1px solid #555
}
.endBox h1{font-size:52px;margin:0 0 15px}
.endButton{
 margin-top:25px;padding:14px 45px;font-size:20px;
 border:0;background:white;color:black;cursor:pointer
}

#mobileControls{position:fixed;inset:0;z-index:80;pointer-events:none;touch-action:none}
#joystick{position:absolute;left:24px;bottom:28px;width:135px;height:135px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.35);pointer-events:auto;touch-action:none}
#stick{position:absolute;left:42px;top:42px;width:51px;height:51px;border-radius:50%;background:rgba(255,255,255,.5)}
#touchActions{position:absolute;right:20px;bottom:20px;width:190px;height:190px;pointer-events:none}
#touchActions button{position:absolute;width:78px;height:58px;border-radius:14px;border:1px solid rgba(255,255,255,.5);background:rgba(0,0,0,.55);color:white;font-weight:bold;font-size:12px;pointer-events:auto;touch-action:none}
#fireBtn{right:0;bottom:70px!important;width:100px!important;height:100px!important;border-radius:50%!important;background:rgba(180,0,0,.65)!important}
#jumpBtn{right:105px;bottom:0}
#reloadBtn{right:105px;bottom:70px}
#weaponBtn{right:0;bottom:0}
@media(max-width:800px){
 .weaponGrid{grid-template-columns:1fr}
 .menuBox{width:90%}
 .logo{font-size:52px}
 #menu{padding-left:5%}
}
</style>
</head>

<body>

<div id="game"></div>

 <div class="menuBox">
  <div class="logo">RIVALS</div>
  <div class="subtitle">WEB FPS</div>

  <button class="menuButton" id="playButton">▶ PLAY</button>

   <div class="stat">

<!-- ================= HUD ================= -->

<div id="hud" class="hidden">

  KILLS <span id="kills">0</span> / 10
 </div>

</div>

<!-- ================= END ================= -->

<script type="module">

import * as THREE from
"three";
import {io} from "https://cdn.socket.io/4.8.1/socket.io.esm.min.js";

import {PointerLockControls} from
"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/PointerLockControls.js";


/* =====================================================
 THREE
===================================================== */

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x101520);

scene.fog=new THREE.Fog(
 0x101520,30,120
);

const camera=new THREE.PerspectiveCamera(
 75,
 innerWidth/innerHeight,
 .1,
 300
);

camera.position.set(0,2,12);

const renderer=new THREE.WebGLRenderer({
 antialias:true
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;

document.getElementById("game").appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(
 0x9db4ff,0x202020,1.8
));

const sun=new THREE.DirectionalLight(
 0xffffff,2.5
);

sun.position.set(30,50,20);
sun.castShadow=true;
scene.add(sun);


/* BONE-BASED HUMANOID RIG + PROCEDURAL ANIMATION */
function createHumanoid(color=0x3989ff){
 const root=new THREE.Group();
 const mat=new THREE.MeshStandardMaterial({color,roughness:.72});
 const skin=new THREE.MeshStandardMaterial({color:0xe5a987,roughness:.8});
 const dark=new THREE.MeshStandardMaterial({color:0x202735,roughness:.75});
 const bone=(name,x,y,z,parent=root)=>{const b=new THREE.Bone();b.name=name;b.position.set(x,y,z);parent.add(b);return b;};
 const part=(geo,material,parent,x=0,y=0,z=0)=>{const m=new THREE.Mesh(geo,material);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;};
 const hips=bone("Hips",0,1.02,0);
 const torso=part(new THREE.BoxGeometry(.82,1.02,.42),mat,hips,0,.46,0);
 const chest=bone("Chest",0,.88,0,hips);
 const neck=bone("Neck",0,.55,0,chest);
 const head=part(new THREE.SphereGeometry(.29,18,14),skin,neck,0,.27,0);
 part(new THREE.CylinderGeometry(.12,.14,.18,10),skin,neck,0,.04,0);
 const makeLimb=(name,parent,x,y,len,width,material)=>{const joint=bone(name,x,y,0,parent);part(new THREE.CapsuleGeometry(width,len,4,8),material,joint,0,-len*.42,0);return joint;};
 const leftShoulder=bone("LeftShoulder",-.53,.42,0,chest),rightShoulder=bone("RightShoulder",.53,.42,0,chest);
 const leftArm=makeLimb("LeftArm",leftShoulder,0,0,.62,.13,mat),rightArm=makeLimb("RightArm",rightShoulder,0,0,.62,.13,mat);
 const leftLeg=makeLimb("LeftLeg",hips,-.22,-.04,.76,.16,dark),rightLeg=makeLimb("RightLeg",hips,.22,-.04,.76,.16,dark);
 const leftFoot=part(new THREE.BoxGeometry(.24,.13,.42),dark,leftLeg,0,-.72,-.08),rightFoot=part(new THREE.BoxGeometry(.24,.13,.42),dark,rightLeg,0,-.72,-.08);
 return {root,torso,head,hips,chest,neck,leftArm,rightArm,leftLeg,rightLeg,leftFoot,rightFoot,phase:0,move:0};
}
function animateHumanoid(rig,dt,move=0,jump=0){
 rig.phase+=dt*(move>0.05?9+move*5:2);
 const swing=Math.sin(rig.phase)*Math.min(1,move);
 rig.leftLeg.rotation.x=swing*.72;rig.rightLeg.rotation.x=-swing*.72;
 rig.leftArm.rotation.x=-swing*.55;rig.rightArm.rotation.x=swing*.55;
 rig.leftArm.rotation.z=.08;rig.rightArm.rotation.z=-.08;
 rig.chest.rotation.x=move>.05?-.035:Math.sin(rig.phase)*.008;
 rig.hips.position.y=1.02+(move>.05?Math.abs(Math.sin(rig.phase*2))*.035:Math.sin(rig.phase)*.012);
 rig.root.position.y=jump>0?.12:0;
}

/* =====================================================
 PLAYER
===================================================== */

const controls=new PointerLockControls(
 camera,document.body
);

scene.add(camera);

const player={
 hp:100,
 kills:0,
 speed:7,
 sprint:12,
 velocityY:0,
 ground:true
};

const keys={};

document.addEventListener("keydown",e=>{

 keys[e.code]=true;

 if(
  e.code==="Space" &&
  player.ground &&
  gameStarted
 ){
  player.velocityY=8;
  player.ground=false;
 }

 if(e.code==="KeyR")reload();

 if(e.code==="Digit1")switchWeapon(0);
 if(e.code==="Digit2")switchWeapon(1);
 if(e.code==="Digit3")switchWeapon(2);

});

document.addEventListener("keyup",e=>{
 keys[e.code]=false;
});


/* =====================================================
 MAP
===================================================== */

function box(x,y,z,w,h,d,color=0x40516d){

 const mesh=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  new THREE.MeshStandardMaterial({color})
 );

 mesh.position.set(x,y,z);
 mesh.castShadow=true;
 mesh.receiveShadow=true;

 scene.add(mesh);

 return mesh;
}

const floor=new THREE.Mesh(
 new THREE.PlaneGeometry(160,160),
 new THREE.MeshStandardMaterial({color:0x202938})
);

floor.rotation.x=-Math.PI/2;
floor.receiveShadow=true;
scene.add(floor);

box(0,7,-55,110,14,2);
box(0,7,55,110,14,2);
box(-55,7,0,2,14,110);
box(55,7,0,2,14,110);

box(0,2,0,16,4,5);
box(-25,2,-18,12,4,5);
box(25,2,18,12,4,5);
box(-28,3,25,5,6,12);
box(28,3,-25,5,6,12);

for(let i=0;i<18;i++){

 const x=(Math.random()-.5)*85;
 const z=(Math.random()-.5)*85;

 if(Math.abs(x)<12 && Math.abs(z)<10)continue;

 box(x,1.5,z,4,3,4,0x72583d);
}


/* =====================================================
 WEAPONS
===================================================== */

const weapons=[

 {
  name:"PISTOL",
  mag:12,
  ammo:12,
  reserve:60,
  damage:34,
  rate:320,
  reload:900,
  spread:.012
 },

 {
  name:"SMG",
  mag:30,
  ammo:30,
  reserve:120,
  damage:17,
  rate:90,
  reload:1200,
  spread:.035
 },

 {
  name:"SHOTGUN",
  mag:6,
  ammo:6,
  reserve:36,
  damage:18,
  pellets:8,
  rate:750,
  reload:1500,
  spread:.12
 }

];

let currentWeapon=0;
let lastShot=0;
let reloading=false;

function weapon(){
 return weapons[currentWeapon];
}

function switchWeapon(i){

 if(reloading)return;

 currentWeapon=i;

 updateHUD();
 updateArsenalUI();
}


/* =====================================================
 ARSENAL
===================================================== */

const arsenal=document.getElementById("arsenal");
const menu=document.getElementById("menu");

document.getElementById("arsenalButton")
.addEventListener("click",()=>{

 menu.classList.add("hidden");
 arsenal.classList.remove("hidden");

 updateArsenalUI();

});


document.getElementById("closeArsenal")
.addEventListener("click",()=>{

 arsenal.classList.add("hidden");
 menu.classList.remove("hidden");

});


document.querySelectorAll(".weaponCard")
.forEach(card=>{

 card.addEventListener("click",()=>{

  const index=
   Number(card.dataset.weapon);

  currentWeapon=index;

  updateArsenalUI();
  updateHUD();

 });

});


function updateArsenalUI(){

 document.querySelectorAll(".weaponCard")
 .forEach(card=>{

  const index=
   Number(card.dataset.weapon);

  const button=
   card.querySelector(".equip");

  const selected=
   index===currentWeapon;

  card.classList.toggle(
   "selected",
   selected
  );

  if(selected){

   button.textContent="EQUIPPED";
   button.classList.add("equipped");

  }else{

   button.textContent="EQUIP";
   button.classList.remove("equipped");

  }

 });

 document.getElementById(
  "equippedText"
 ).textContent=
 "EQUIPPED: "+
 weapons[currentWeapon].name;
}


/* =====================================================
 ENEMIES
===================================================== */

const enemies=[];

const spawnPoints=[
 [-40,-40],
 [40,-40],
 [-40,40],
 [40,40],
 [0,-40],
 [0,40],
 [-40,0],
 [40,0]
];

function createEnemy(x,z){
 const rig=createHumanoid(0xd63838);
 rig.root.position.set(x,0,z);scene.add(rig.root);
 enemies.push({group:rig.root,body:rig.torso,head:rig.head,rig,hp:100,speed:1.7+Math.random()*1.3,cooldown:Math.random(),alive:true});
}

for(let i=0;i<6;i++){

 const p=spawnPoints[i];

 createEnemy(p[0],p[1]);
}


/* =====================================================
 SHOOT
===================================================== */

document.addEventListener("mousedown",e=>{

 if(e.button===0 && gameStarted && (controls.isLocked || !matchMedia("(pointer:fine)").matches)){
  shoot();
}

});


function shoot(){

 const w=weapon();
 const now=performance.now();

 if(
  reloading ||
  now-lastShot<w.rate
 )return;

 if(w.ammo<=0){
  reload();
  return;
 }

 lastShot=now;
 w.ammo--;
 if(onlineSocket&&onlineSocket.connected&&onlineRoom)onlineSocket.emit("player:fire",{weapon:currentWeapon});

 const pellets=w.pellets||1;

 for(let i=0;i<pellets;i++){

  const direction=
   new THREE.Vector3(0,0,-1);

  direction.applyQuaternion(
   camera.quaternion
  );

  direction.x+=(Math.random()-.5)*w.spread;
  direction.y+=(Math.random()-.5)*w.spread;
  direction.normalize();

  const ray=new THREE.Raycaster(
   camera.position,
   direction,
   0,
   150
  );

  const targets=[];

  enemies.forEach(e=>{
   if(e.alive)
    targets.push(e.body,e.head);
  });

  const hits=
   ray.intersectObjects(
    targets,false
   );

  if(!hits.length)continue;

  const hit=hits[0];

  const enemy=enemies.find(
   e=>
   e.body===hit.object ||
   e.head===hit.object
  );

  if(!enemy)continue;

  let damage=w.damage;

  if(hit.object===enemy.head)
   damage*=1.8;

  enemy.hp-=damage;

  hitMarker();

  if(enemy.hp<=0)
   kill(enemy);

 }

 updateHUD();
}


/* =====================================================
 RELOAD
===================================================== */

function reload(){

 const w=weapon();

 if(reloading)return;
 if(w.ammo>=w.mag)return;
 if(w.reserve<=0)return;

 reloading=true;

 message("RELOADING...");

 setTimeout(()=>{

  const needed=w.mag-w.ammo;
  const amount=Math.min(
   needed,w.reserve
  );

  w.ammo+=amount;
  w.reserve-=amount;

  reloading=false;

  message("");
  updateHUD();

 },w.reload);
}


/* =====================================================
 KILL
===================================================== */

function kill(enemy){

 if(!enemy.alive)return;

 enemy.alive=false;
 scene.remove(enemy.group);

 player.kills++;

 message("+1 KILL");
 updateHUD();

 if(player.kills>=10){

  setTimeout(victory,600);

 }else{

  setTimeout(spawnEnemy,700);

 }

}

function spawnEnemy(){

 const p=
  spawnPoints[
   Math.floor(
    Math.random()*spawnPoints.length
   )
  ];

 createEnemy(p[0],p[1]);
}


/* =====================================================
 ENEMY AI
===================================================== */

function updateEnemies(delta){

 enemies.forEach(e=>{

  if(!e.alive)return;

  const direction=
   new THREE.Vector3()
   .subVectors(
    camera.position,
    e.group.position
   );

  const distance=
   direction.length();

  direction.y=0;

  if(distance>8){

   direction.normalize();

   e.group.position.add(
    direction.multiplyScalar(
     e.speed*delta
    )
   );
   animateHumanoid(e.rig,delta,1,0);

  }else{

   animateHumanoid(e.rig,delta,0,0);
   e.cooldown-=delta;

   if(e.cooldown<=0){

    e.cooldown=
     .8+Math.random()*.8;

    damagePlayer(
     8+Math.random()*8
    );

   }
  }

  e.group.lookAt(
   camera.position.x,
   e.group.position.y,
   camera.position.z
  );

 });
}


/* =====================================================
 DAMAGE
===================================================== */

function damagePlayer(amount){

 player.hp-=amount;

 player.hp=Math.max(
  0,player.hp
 );

 const flash=
  document.getElementById(
   "damageFlash"
  );

 flash.style.opacity="1";

 setTimeout(()=>{
  flash.style.opacity="0";
 },100);

 updateHUD();

 if(player.hp<=0)
  defeat();
}


/* =====================================================
 GAME START / HUD / LOOP / MENU FIX
===================================================== */

let gameStarted=false;

const playButton=document.getElementById("playButton");
const settingsButton=document.getElementById("settingsButton");
const hud=document.getElementById("hud");
const endScreen=document.getElementById("endScreen");

const mobileControls=document.getElementById("mobileControls");
const isTouchDevice=matchMedia("(pointer:coarse)").matches || "ontouchstart" in window;
if(isTouchDevice) mobileControls.classList.remove("hidden");

playButton.addEventListener("click",()=>{
  gameStarted=true;
  menu.classList.add("hidden");
  hud.classList.remove("hidden");
  if(isTouchDevice) mobileControls.classList.remove("hidden");
  player.hp=100;
  player.kills=0;
  updateHUD();
  camera.position.set(0,2,12);

  // 電腦使用滑鼠鎖定；iPad/手機沒有 Pointer Lock 也要能正常進入遊戲
  try{
    if(typeof controls.lock==="function" && matchMedia("(pointer:fine)").matches){
      controls.lock();
    }else{
      message("遊戲已開始：觸控裝置目前可進入遊戲");
    }
  }catch(err){
    console.warn("Pointer Lock unavailable:",err);
    message("遊戲已開始");
  }
});

settingsButton.addEventListener("click",showSettings);

function showSettings(){
  let panel=document.getElementById("settingsPanel");
  if(!panel){
    panel=document.createElement("div");
    panel.id="settingsPanel";
    panel.style.cssText="position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;color:white";
    panel.innerHTML='<div style="width:420px;max-width:90%;padding:35px;background:#111;border:1px solid #555;text-align:center"><h1>SETTINGS</h1><p>WASD：移動　SHIFT：衝刺　SPACE：跳躍</p><p>左鍵：射擊　R：換彈　1/2/3：切換武器</p><button id="closeSettings" style="padding:12px 30px;font-size:18px">BACK</button></div>';
    document.body.appendChild(panel);
    document.getElementById("closeSettings").addEventListener("click",()=>panel.remove());
  }
}

controls.addEventListener("unlock",()=>{
  if(gameStarted) message("點 PLAY 重新進入遊戲");
});

function updateHUD(){
  const w=weapon();
  document.getElementById("kills").textContent=player.kills;
  document.getElementById("healthText").textContent="HP "+Math.ceil(player.hp);
  document.getElementById("healthFill").style.width=Math.max(0,player.hp)+"%";
  document.getElementById("weaponName").textContent=w.name;
  document.getElementById("ammoNumber").textContent=w.ammo;
  document.getElementById("reserve").textContent=w.reserve;
}

let messageTimer=null;
function message(text){
  const el=document.getElementById("message");
  el.textContent=text;
  clearTimeout(messageTimer);
  if(text) messageTimer=setTimeout(()=>el.textContent="",900);
}

let hitTimer=null;
function hitMarker(){
  const el=document.getElementById("hitmarker");
  el.style.opacity="1";
  clearTimeout(hitTimer);
  hitTimer=setTimeout(()=>el.style.opacity="0",90);
}

function victory(){
  gameStarted=false;
  if(typeof controls.unlock==="function") controls.unlock();
  hud.classList.add("hidden");
  endScreen.classList.remove("hidden");
  document.getElementById("endTitle").textContent="VICTORY";
  document.getElementById("endText").textContent="你完成了本回合！";
}

function defeat(){
  gameStarted=false;
  if(typeof controls.unlock==="function") controls.unlock();
  hud.classList.add("hidden");
  endScreen.classList.remove("hidden");
  document.getElementById("endTitle").textContent="DEFEAT";
  document.getElementById("endText").textContent="你被擊敗了。";
}

document.getElementById("restart").addEventListener("click",()=>{
  enemies.forEach(e=>{e.alive=false;scene.remove(e.group);});
  enemies.length=0;
  for(let i=0;i<6;i++){
    const p=spawnPoints[i];
    createEnemy(p[0],p[1]);
  }
  player.hp=100;
  player.kills=0;
  currentWeapon=0;
  weapons[0].ammo=12; weapons[0].reserve=60;
  weapons[1].ammo=30; weapons[1].reserve=120;
  weapons[2].ammo=6; weapons[2].reserve=36;
  endScreen.classList.add("hidden");
  menu.classList.remove("hidden");
  updateHUD();
});

window.addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

let touchMoveX=0,touchMoveY=0;
let lookTouch=null;
document.addEventListener("touchstart",e=>{
 if(!gameStarted)return;
 for(const t of e.changedTouches){
  if(t.clientX>innerWidth*.35 && t.clientY<innerHeight*.85){
   lookTouch={id:t.identifier,x:t.clientX,y:t.clientY};
  }
 }
},{passive:false});
document.addEventListener("touchmove",e=>{
 if(!lookTouch)return;
 for(const t of e.changedTouches) if(t.identifier===lookTouch.id){
  const dx=t.clientX-lookTouch.x,dy=t.clientY-lookTouch.y;
  lookTouch.x=t.clientX;lookTouch.y=t.clientY;
  camera.rotation.y-=dx*.004;
  camera.rotation.x-=dy*.004;
  camera.rotation.x=Math.max(-1.45,Math.min(1.45,camera.rotation.x));
  e.preventDefault();
 }
},{passive:false});
document.addEventListener("touchend",e=>{
 for(const t of e.changedTouches) if(lookTouch&&t.identifier===lookTouch.id) lookTouch=null;
},{passive:false});

const joystick=document.getElementById("joystick"),stick=document.getElementById("stick");
let joyId=null;
joystick.addEventListener("touchstart",e=>{joyId=e.changedTouches[0].identifier;e.preventDefault()},{passive:false});
joystick.addEventListener("touchmove",e=>{
 for(const t of e.changedTouches)if(t.identifier===joyId){
  const r=joystick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  let dx=t.clientX-cx,dy=t.clientY-cy;const max=48,len=Math.hypot(dx,dy);
  if(len>max){dx=dx/len*max;dy=dy/len*max}
  stick.style.transform=`translate(${dx}px,${dy}px)`;
  touchMoveX=dx/max;touchMoveY=dy/max;e.preventDefault();
 }
},{passive:false});
joystick.addEventListener("touchend",()=>{joyId=null;touchMoveX=touchMoveY=0;stick.style.transform="translate(0,0)"});

document.getElementById("fireBtn").addEventListener("touchstart",e=>{e.preventDefault();shoot()},{passive:false});
document.getElementById("jumpBtn").addEventListener("touchstart",e=>{e.preventDefault();if(player.ground){player.velocityY=8;player.ground=false}},{passive:false});
document.getElementById("reloadBtn").addEventListener("touchstart",e=>{e.preventDefault();reload()},{passive:false});
document.getElementById("weaponBtn").addEventListener("touchstart",e=>{e.preventDefault();switchWeapon((currentWeapon+1)%weapons.length)},{passive:false});

function updatePlayer(delta){
  if(!gameStarted)return;
  const speed=(keys["ShiftLeft"]||keys["ShiftRight"])?player.sprint:player.speed;
  if(controls.isLocked){
    if(keys["KeyW"])controls.moveForward(speed*delta);
    if(keys["KeyS"])controls.moveForward(-speed*delta);
    if(keys["KeyA"])controls.moveRight(-speed*delta);
    if(keys["KeyD"])controls.moveRight(speed*delta);
  }else if(isTouchDevice){
    const forward=-touchMoveY*speed*delta,right=touchMoveX*speed*delta;
    const yaw=camera.rotation.y;
    camera.position.x += Math.sin(yaw)*forward + Math.cos(yaw)*right;
    camera.position.z += Math.cos(yaw)*forward - Math.sin(yaw)*right;
  }
  player.velocityY-=20*delta;
  camera.position.y+=player.velocityY*delta;
  if(camera.position.y<=2){
    camera.position.y=2;
    player.velocityY=0;
    player.ground=true;
  }
}

let previousTime=performance.now();
function animate(){
  requestAnimationFrame(animate);
  const now=performance.now();
  const delta=Math.min((now-previousTime)/1000,.05);
  previousTime=now;
  updatePlayer(delta);
  if(onlineSocket&&onlineSocket.connected&&onlineRoom&&now-lastNetUpdate>50){
    lastNetUpdate=now;
    onlineSocket.emit("player:update",{x:camera.position.x,y:camera.position.y,z:camera.position.z,yaw:camera.rotation.y,pitch:camera.rotation.x,weapon:currentWeapon});
  }
  if(gameStarted&&!onlineRoom) updateEnemies(delta);
  renderer.render(scene,camera);
}


/* ================= ONLINE MULTIPLAYER ================= */
let onlineSocket=null, onlineRoom=null, lastNetUpdate=0;
const remotePlayers=new Map();
const matchButton=document.getElementById("matchButton");
function setMatchLabel(text){matchButton.textContent=text;}
function clearRemotePlayers(){remotePlayers.forEach(v=>scene.remove(v.mesh));remotePlayers.clear();}
function addRemotePlayer(p){
 if(!p||p.id===onlineSocket.id)return;
 let entry=remotePlayers.get(p.id);
 if(!entry){
  const rig=createHumanoid(0x3989ff);
  const mesh=rig.root;scene.add(mesh);
  entry={mesh,rig,name:p.name||"Player",lastX:p.x||0,lastZ:p.z||0};remotePlayers.set(p.id,entry);
 }
 const nx=p.x||0,nz=p.z||0;
 const moved=Math.hypot(nx-entry.lastX,nz-entry.lastZ)>.015?1:0;
 entry.mesh.position.set(nx,0,nz);
 entry.mesh.rotation.y=p.yaw||0;
 animateHumanoid(entry.rig,1/20,moved,0);
 entry.lastX=nx;entry.lastZ=nz;
}
matchButton.addEventListener("click",()=>{
 if(onlineSocket&&onlineSocket.connected){
  onlineSocket.emit("queue:leave");
  onlineSocket.disconnect();onlineSocket=null;onlineRoom=null;
  clearRemotePlayers();setMatchLabel("⚔ ONLINE MATCH");message("已離開線上配對");return;
 }
 const endpoint=prompt("輸入已部署的多人伺服器網址（例如 https://your-server.example.com）","http://localhost:3000");
 if(!endpoint)return;
 try{
  onlineSocket=io(endpoint,{transports:["websocket","polling"]});
  setMatchLabel("CONNECTING...");
  onlineSocket.on("connect",()=>{
   setMatchLabel("SEARCHING...");
   onlineSocket.emit("queue:join",{name:"Player"});
  });
  onlineSocket.on("connect_error",()=>{
   setMatchLabel("CONNECTION FAILED");
   message("無法連線，請確認伺服器網址與部署狀態");
  });
  onlineSocket.on("queue:status",data=>setMatchLabel(data.status==="searching"?"SEARCHING...":"⚔ ONLINE MATCH"));
  onlineSocket.on("match:found",data=>{
   onlineRoom=data.roomId;
   clearRemotePlayers();
   (data.players||[]).forEach(addRemotePlayer);
   setMatchLabel(data.status==="ready"?"MATCH READY":"WAITING...");
  });
  onlineSocket.on("match:ready",()=>{
   gameStarted=true;menu.classList.add("hidden");hud.classList.remove("hidden");
   if(isTouchDevice)mobileControls.classList.remove("hidden");
   if(matchMedia("(pointer:fine)").matches)controls.lock();
   message("配對成功！");
  });
  onlineSocket.on("player:joined",data=>addRemotePlayer(data.player));
  onlineSocket.on("room:state",data=>(data.players||[]).forEach(addRemotePlayer));
  onlineSocket.on("player:update",data=>addRemotePlayer(data));
  onlineSocket.on("player:left",data=>{
   const item=remotePlayers.get(data.id);if(item)scene.remove(item.mesh);
   remotePlayers.delete(data.id);
  });
  onlineSocket.on("player:fire",()=>{});
  onlineSocket.on("disconnect",()=>{onlineRoom=null;setMatchLabel("⚔ ONLINE MATCH");});
 }catch(err){setMatchLabel("⚔ ONLINE MATCH");message("伺服器網址格式錯誤");}
});

updateHUD();
updateArsenalUI();
animate();

</script>
