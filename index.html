<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RIVALS WEB FPS</title>

<style>
*{box-sizing:border-box;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;font-family:Arial,"Microsoft JhengHei",sans-serif}
#game{width:100vw;height:100vh}

.hidden{display:none!important}

/* ================= MENU ================= */

#menu{
 position:fixed;inset:0;z-index:100;
 background:
 linear-gradient(90deg,rgba(0,0,0,.86),rgba(0,0,0,.25),rgba(0,0,0,.7)),
 url("https://sm.ign.com/ign_za/cover/r/rivals-rob/rivals-roblox_2s2w.jpg") center/cover no-repeat;
 display:flex;align-items:center;padding-left:8%;
}

.menuBox{width:430px;color:white}
.logo{
 font-size:72px;font-weight:1000;letter-spacing:7px;font-style:italic;
 text-shadow:4px 4px 0 #000,0 0 25px rgba(255,255,255,.3)
}
.subtitle{margin:-8px 0 35px;color:#ccc;letter-spacing:5px}

.menuButton{
 width:310px;display:block;margin:13px 0;padding:16px 22px;
 border:1px solid rgba(255,255,255,.35);
 background:rgba(0,0,0,.58);color:white;
 font-size:21px;font-weight:bold;text-align:left;
 cursor:pointer;transition:.15s
}
.menuButton:hover{background:white;color:black;transform:translateX(8px)}
.version{margin-top:40px;color:#999;font-size:13px}

/* ================= ARSENAL ================= */

#arsenal{
 position:fixed;inset:0;z-index:150;
 background:
 linear-gradient(rgba(5,8,14,.92),rgba(5,8,14,.97)),
 url("https://sm.ign.com/ign_za/cover/r/rivals-rob/rivals-roblox_2s2w.jpg") center/cover;
 color:white;padding:45px 6%;
 overflow:auto;
}

.arsenalTop{
 display:flex;align-items:center;justify-content:space-between;
 border-bottom:1px solid #444;padding-bottom:20px
}

.arsenalTitle{font-size:46px;font-weight:900;letter-spacing:3px}
.backButton{
 background:rgba(255,255,255,.08);border:1px solid #666;
 color:white;padding:12px 24px;font-size:17px;cursor:pointer
}
.backButton:hover{background:white;color:black}

.weaponGrid{
 display:grid;
 grid-template-columns:repeat(3,minmax(180px,1fr));
 gap:22px;margin-top:35px;max-width:1100px
}

.weaponCard{
 min-height:420px;padding:25px;
 background:rgba(10,14,23,.82);
 border:1px solid #3d4656;
 cursor:pointer;transition:.18s;
 position:relative
}
.weaponCard:hover{transform:translateY(-5px);border-color:white}
.weaponCard.selected{border:2px solid #fff;box-shadow:0 0 25px rgba(255,255,255,.12)}

.weaponIcon{
 height:170px;
 display:flex;align-items:center;justify-content:center;
 font-size:90px;
 filter:drop-shadow(0 10px 10px rgba(0,0,0,.6))
}

.weaponCard h2{margin:5px 0;font-size:28px}
.weaponType{color:#999;margin-bottom:20px}

.stat{margin:12px 0}
.statName{display:flex;justify-content:space-between;font-size:13px;color:#bbb}
.statBar{height:6px;background:#252a32;margin-top:5px}
.statFill{height:100%;background:white}

.equip{
 width:100%;margin-top:18px;padding:12px;
 background:white;color:black;border:0;
 font-weight:bold;font-size:16px;cursor:pointer
}
.equip:hover{background:#ccc}
.equipped{
 background:#222;color:#fff;cursor:default
}

#equippedText{
 margin-top:25px;color:#aaa;font-size:15px
}

/* ================= HUD ================= */

#hud{
 position:fixed;inset:0;pointer-events:none;z-index:20;color:white
}
#crosshair{
 position:absolute;left:50%;top:50%;
 width:22px;height:22px;transform:translate(-50%,-50%)
}
#crosshair:before,#crosshair:after{
 content:"";position:absolute;background:white;box-shadow:0 0 5px black
}
#crosshair:before{width:2px;height:22px;left:10px}
#crosshair:after{width:22px;height:2px;top:10px}

#topbar{
 position:absolute;top:18px;left:50%;
 transform:translateX(-50%);
 padding:10px 22px;background:rgba(0,0,0,.6);
 border:1px solid rgba(255,255,255,.25);border-radius:10px
}

#healthBox{position:absolute;left:25px;bottom:25px;width:260px}
#healthText{font-size:18px;margin-bottom:7px;font-weight:bold}
#healthBar{height:17px;background:#111;border:1px solid white;border-radius:8px;overflow:hidden}
#healthFill{height:100%;width:100%;background:#28df70}

#ammo{position:absolute;right:30px;bottom:25px;text-align:right}
#weaponName{font-size:18px}
#ammoNumber{font-size:46px;font-weight:bold}

#message{
 position:absolute;top:64%;left:50%;
 transform:translateX(-50%);
 font-size:24px;font-weight:bold;text-shadow:0 2px 5px black
}

#hitmarker{
 position:absolute;top:50%;left:50%;
 transform:translate(-50%,-50%);
 font-size:28px;opacity:0
}

#damageFlash{
 position:fixed;inset:0;background:rgba(255,0,0,.4);
 opacity:0;pointer-events:none;z-index:50
}

/* ================= END ================= */

#endScreen{
 position:fixed;inset:0;z-index:200;
 background:rgba(0,0,0,.85);
 display:flex;justify-content:center;align-items:center;
 color:white;text-align:center
}
.endBox{
 width:450px;padding:45px;
 background:rgba(10,10,15,.96);border:1px solid #555
}
.endBox h1{font-size:52px;margin:0 0 15px}
.endButton{
 margin-top:25px;padding:14px 45px;font-size:20px;
 border:0;background:white;color:black;cursor:pointer
}

@media(max-width:800px){
 .weaponGrid{grid-template-columns:1fr}
 .menuBox{width:90%}
 .logo{font-size:52px}
 #menu{padding-left:5%}
}
</style>
</head>

<body>

<div id="game"></div>

<!-- ================= MENU ================= -->

<div id="menu">
 <div class="menuBox">
  <div class="logo">RIVALS</div>
  <div class="subtitle">WEB FPS</div>

  <button class="menuButton" id="playButton">▶ PLAY</button>
  <button class="menuButton" id="arsenalButton">🔫 ARSENAL</button>
  <button class="menuButton" id="settingsButton">⚙ SETTINGS</button>

  <div class="version">WEB FPS PROTOTYPE</div>
 </div>
</div>


<!-- ================= ARSENAL ================= -->

<div id="arsenal" class="hidden">

 <div class="arsenalTop">
  <div class="arsenalTitle">ARSENAL</div>
  <button class="backButton" id="closeArsenal">← BACK</button>

 <div id="equippedText">
  EQUIPPED: PISTOL
 </div>

 <div class="weaponGrid">

  <div class="weaponCard selected" data-weapon="0">

   <div class="weaponIcon">🔫</div>

   <h2>PISTOL</h2>
   <div class="weaponType">SIDEARM</div>

   <div class="stat">
    <div class="statName">
     <span>DAMAGE</span><span>34</span>
    </div>
    <div class="statBar">
     <div class="statFill" style="width:68%"></div>
    </div>
   </div>

   <div class="stat">
    <div class="statName">
     <span>FIRE RATE</span><span>75</span>
    </div>
    <div class="statBar">
     <div class="statFill" style="width:55%"></div>
    </div>
   </div>

   <div class="stat">
    <div class="statName">
     <span>MAGAZINE</span><span>12</span>
    </div>
    <div class="statBar">
     <div class="statFill" style="width:40%"></div>
    </div>
   </div>

   <button class="equip equipped">EQUIPPED</button>
  </div>


  <div class="weaponCard" data-weapon="1">

   <div class="weaponIcon">🔫</div>

   <h2>SMG</h2>
   <div class="weaponType">SUBMACHINE GUN</div>

   <div class="stat">
    <div class="statName">
     <span>DAMAGE</span><span>17</span>
    </div>
    <div class="statBar">
     <div class="statFill" style="width:34%"></div>
    </div>
   </div>

   <div class="stat">
    <div class="statName">
     <span>FIRE RATE</span><span>95</span>
    </div>
    <div class="statBar">
     <div class="statFill" style="width:95%"></div>
    </div>
   </div>

   <div class="stat">
    <div class="statName">
     <span>MAGAZINE</span><span>30</span>
    </div>
    <div class="statBar">
     <div class="statFill" style="width:100%"></div>
    </div>
   </div>

   <button class="equip">EQUIP</button>
  </div>


  <div class="weaponCard" data-weapon="2">

   <div class="weaponIcon">💥</div>

   <h2>SHOTGUN</h2>
   <div class="weaponType">SHOTGUN</div>

   <div class="stat">
    <div class="statName">
     <span>DAMAGE</span><span>90</span>
    </div>
    <div class="statBar">
     <div class="statFill" style="width:95%"></div>
    </div>
   </div>

   <div class="stat">
    <div class="statName">
     <span>FIRE RATE</span><span>35</span>
    </div>
    <div class="statBar">
     <div class="statFill" style="width:35%"></div>
    </div>
   </div>

   <div class="stat">
    <div class="statName">
     <span>MAGAZINE</span><span>6</span>
    </div>
    <div class="statBar">
     <div class="statFill" style="width:20%"></div>
    </div>
   </div>

   <button class="equip">EQUIP</button>
  </div>

 </div>
</div>


<!-- ================= HUD ================= -->

<div id="hud" class="hidden">

 <div id="topbar">
  KILLS <span id="kills">0</span> / 10
 </div>

 <div id="crosshair"></div>

 <div id="healthBox">
  <div id="healthText">HP 100</div>
  <div id="healthBar">
   <div id="healthFill"></div>
  </div>
 </div>

 <div id="ammo">
  <div id="weaponName">PISTOL</div>
  <span id="ammoNumber">12</span> /
  <span id="reserve">60</span>
 </div>

 <div id="hitmarker">✕</div>
 <div id="message"></div>

</div>

<div id="damageFlash"></div>


<!-- ================= END ================= -->

<div id="endScreen" class="hidden">
 <div class="endBox">
  <h1 id="endTitle">VICTORY</h1>
  <p id="endText">你完成了本回合。</p>
  <button class="endButton" id="restart">PLAY AGAIN</button>
 </div>
</div>


<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">

import * as THREE from
"three";

import {PointerLockControls} from
"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/PointerLockControls.js";


/* =====================================================
 THREE
===================================================== */

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x101520);

scene.fog=new THREE.Fog(
 0x101520,30,120
);

const camera=new THREE.PerspectiveCamera(
 75,
 innerWidth/innerHeight,
 .1,
 300
);

camera.position.set(0,2,12);

const renderer=new THREE.WebGLRenderer({
 antialias:true
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;

document.getElementById("game").appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(
 0x9db4ff,0x202020,1.8
));

const sun=new THREE.DirectionalLight(
 0xffffff,2.5
);

sun.position.set(30,50,20);
sun.castShadow=true;
scene.add(sun);


/* =====================================================
 PLAYER
===================================================== */

const controls=new PointerLockControls(
 camera,document.body
);

scene.add(camera);

const player={
 hp:100,
 kills:0,
 speed:7,
 sprint:12,
 velocityY:0,
 ground:true
};

const keys={};

document.addEventListener("keydown",e=>{

 keys[e.code]=true;

 if(
  e.code==="Space" &&
  player.ground &&
  gameStarted
 ){
  player.velocityY=8;
  player.ground=false;
 }

 if(e.code==="KeyR")reload();

 if(e.code==="Digit1")switchWeapon(0);
 if(e.code==="Digit2")switchWeapon(1);
 if(e.code==="Digit3")switchWeapon(2);

});

document.addEventListener("keyup",e=>{
 keys[e.code]=false;
});


/* =====================================================
 MAP
===================================================== */

function box(x,y,z,w,h,d,color=0x40516d){

 const mesh=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  new THREE.MeshStandardMaterial({color})
 );

 mesh.position.set(x,y,z);
 mesh.castShadow=true;
 mesh.receiveShadow=true;

 scene.add(mesh);

 return mesh;
}

const floor=new THREE.Mesh(
 new THREE.PlaneGeometry(160,160),
 new THREE.MeshStandardMaterial({color:0x202938})
);

floor.rotation.x=-Math.PI/2;
floor.receiveShadow=true;
scene.add(floor);

box(0,7,-55,110,14,2);
box(0,7,55,110,14,2);
box(-55,7,0,2,14,110);
box(55,7,0,2,14,110);

box(0,2,0,16,4,5);
box(-25,2,-18,12,4,5);
box(25,2,18,12,4,5);
box(-28,3,25,5,6,12);
box(28,3,-25,5,6,12);

for(let i=0;i<18;i++){

 const x=(Math.random()-.5)*85;
 const z=(Math.random()-.5)*85;

 if(Math.abs(x)<12 && Math.abs(z)<10)continue;

 box(x,1.5,z,4,3,4,0x72583d);
}


/* =====================================================
 WEAPONS
===================================================== */

const weapons=[

 {
  name:"PISTOL",
  mag:12,
  ammo:12,
  reserve:60,
  damage:34,
  rate:320,
  reload:900,
  spread:.012
 },

 {
  name:"SMG",
  mag:30,
  ammo:30,
  reserve:120,
  damage:17,
  rate:90,
  reload:1200,
  spread:.035
 },

 {
  name:"SHOTGUN",
  mag:6,
  ammo:6,
  reserve:36,
  damage:18,
  pellets:8,
  rate:750,
  reload:1500,
  spread:.12
 }

];

let currentWeapon=0;
let lastShot=0;
let reloading=false;

function weapon(){
 return weapons[currentWeapon];
}

function switchWeapon(i){

 if(reloading)return;

 currentWeapon=i;

 updateHUD();
 updateArsenalUI();
}


/* =====================================================
 ARSENAL
===================================================== */

const arsenal=document.getElementById("arsenal");
const menu=document.getElementById("menu");

document.getElementById("arsenalButton")
.addEventListener("click",()=>{

 menu.classList.add("hidden");
 arsenal.classList.remove("hidden");

 updateArsenalUI();

});


document.getElementById("closeArsenal")
.addEventListener("click",()=>{

 arsenal.classList.add("hidden");
 menu.classList.remove("hidden");

});


document.querySelectorAll(".weaponCard")
.forEach(card=>{

 card.addEventListener("click",()=>{

  const index=
   Number(card.dataset.weapon);

  currentWeapon=index;

  updateArsenalUI();
  updateHUD();

 });

});


function updateArsenalUI(){

 document.querySelectorAll(".weaponCard")
 .forEach(card=>{

  const index=
   Number(card.dataset.weapon);

  const button=
   card.querySelector(".equip");

  const selected=
   index===currentWeapon;

  card.classList.toggle(
   "selected",
   selected
  );

  if(selected){

   button.textContent="EQUIPPED";
   button.classList.add("equipped");

  }else{

   button.textContent="EQUIP";
   button.classList.remove("equipped");

  }

 });

 document.getElementById(
  "equippedText"
 ).textContent=
 "EQUIPPED: "+
 weapons[currentWeapon].name;
}


/* =====================================================
 ENEMIES
===================================================== */

const enemies=[];

const spawnPoints=[
 [-40,-40],
 [40,-40],
 [-40,40],
 [40,40],
 [0,-40],
 [0,40],
 [-40,0],
 [40,0]
];

function createEnemy(x,z){

 const group=new THREE.Group();

 group.position.set(x,0,z);

 const body=new THREE.Mesh(
  new THREE.BoxGeometry(1.2,2,.8),
  new THREE.MeshStandardMaterial({color:0xd63838})
 );

 body.position.y=1;

 const head=new THREE.Mesh(
  new THREE.SphereGeometry(.45,16,16),
  new THREE.MeshStandardMaterial({color:0xffad8c})
 );

 head.position.y=2.35;

 body.castShadow=true;
 head.castShadow=true;

 group.add(body,head);
 scene.add(group);

 enemies.push({
  group,
  body,
  head,
  hp:100,
  speed:1.7+Math.random()*1.3,
  cooldown:Math.random(),
  alive:true
 });
}

for(let i=0;i<6;i++){

 const p=spawnPoints[i];

 createEnemy(p[0],p[1]);
}


/* =====================================================
 SHOOT
===================================================== */

document.addEventListener("mousedown",e=>{

 if(
  e.button===0 &&
  controls.isLocked &&
  gameStarted
 ){
  shoot();
 }

});


function shoot(){

 const w=weapon();
 const now=performance.now();

 if(
  reloading ||
  now-lastShot<w.rate
 )return;

 if(w.ammo<=0){
  reload();
  return;
 }

 lastShot=now;
 w.ammo--;

 const pellets=w.pellets||1;

 for(let i=0;i<pellets;i++){

  const direction=
   new THREE.Vector3(0,0,-1);

  direction.applyQuaternion(
   camera.quaternion
  );

  direction.x+=(Math.random()-.5)*w.spread;
  direction.y+=(Math.random()-.5)*w.spread;
  direction.normalize();

  const ray=new THREE.Raycaster(
   camera.position,
   direction,
   0,
   150
  );

  const targets=[];

  enemies.forEach(e=>{
   if(e.alive)
    targets.push(e.body,e.head);
  });

  const hits=
   ray.intersectObjects(
    targets,false
   );

  if(!hits.length)continue;

  const hit=hits[0];

  const enemy=enemies.find(
   e=>
   e.body===hit.object ||
   e.head===hit.object
  );

  if(!enemy)continue;

  let damage=w.damage;

  if(hit.object===enemy.head)
   damage*=1.8;

  enemy.hp-=damage;

  hitMarker();

  if(enemy.hp<=0)
   kill(enemy);

 }

 updateHUD();
}


/* =====================================================
 RELOAD
===================================================== */

function reload(){

 const w=weapon();

 if(reloading)return;
 if(w.ammo>=w.mag)return;
 if(w.reserve<=0)return;

 reloading=true;

 message("RELOADING...");

 setTimeout(()=>{

  const needed=w.mag-w.ammo;
  const amount=Math.min(
   needed,w.reserve
  );

  w.ammo+=amount;
  w.reserve-=amount;

  reloading=false;

  message("");
  updateHUD();

 },w.reload);
}


/* =====================================================
 KILL
===================================================== */

function kill(enemy){

 if(!enemy.alive)return;

 enemy.alive=false;
 scene.remove(enemy.group);

 player.kills++;

 message("+1 KILL");
 updateHUD();

 if(player.kills>=10){

  setTimeout(victory,600);

 }else{

  setTimeout(spawnEnemy,700);

 }

}

function spawnEnemy(){

 const p=
  spawnPoints[
   Math.floor(
    Math.random()*spawnPoints.length
   )
  ];

 createEnemy(p[0],p[1]);
}


/* =====================================================
 ENEMY AI
===================================================== */

function updateEnemies(delta){

 enemies.forEach(e=>{

  if(!e.alive)return;

  const direction=
   new THREE.Vector3()
   .subVectors(
    camera.position,
    e.group.position
   );

  const distance=
   direction.length();

  direction.y=0;

  if(distance>8){

   direction.normalize();

   e.group.position.add(
    direction.multiplyScalar(
     e.speed*delta
    )
   );

  }else{

   e.cooldown-=delta;

   if(e.cooldown<=0){

    e.cooldown=
     .8+Math.random()*.8;

    damagePlayer(
     8+Math.random()*8
    );

   }
  }

  e.group.lookAt(
   camera.position.x,
   e.group.position.y,
   camera.position.z
  );

 });
}


/* =====================================================
 DAMAGE
===================================================== */

function damagePlayer(amount){

 player.hp-=amount;

 player.hp=Math.max(
  0,player.hp
 );

 const flash=
  document.getElementById(
   "damageFlash"
  );

 flash.style.opacity="1";

 setTimeout(()=>{
  flash.style.opacity="0";
 },100);

 updateHUD();

 if(player.hp<=0)
  defeat();
}


/* =====================================================
 GAME START / HUD / LOOP / MENU FIX
===================================================== */

let gameStarted=false;

const playButton=document.getElementById("playButton");
const settingsButton=document.getElementById("settingsButton");
const hud=document.getElementById("hud");
const endScreen=document.getElementById("endScreen");

playButton.addEventListener("click",()=>{
  gameStarted=true;
  menu.classList.add("hidden");
  hud.classList.remove("hidden");
  player.hp=100;
  player.kills=0;
  updateHUD();
  camera.position.set(0,2,12);

  if(typeof controls.lock==="function"){
    controls.lock();
  }else{
    message("此瀏覽器不支援滑鼠鎖定");
  }
});

settingsButton.addEventListener("click",showSettings);

function showSettings(){
  let panel=document.getElementById("settingsPanel");
  if(!panel){
    panel=document.createElement("div");
    panel.id="settingsPanel";
    panel.style.cssText="position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;color:white";
    panel.innerHTML='<div style="width:420px;max-width:90%;padding:35px;background:#111;border:1px solid #555;text-align:center"><h1>SETTINGS</h1><p>WASD：移動　SHIFT：衝刺　SPACE：跳躍</p><p>左鍵：射擊　R：換彈　1/2/3：切換武器</p><button id="closeSettings" style="padding:12px 30px;font-size:18px">BACK</button></div>';
    document.body.appendChild(panel);
    document.getElementById("closeSettings").addEventListener("click",()=>panel.remove());
  }
}

controls.addEventListener("unlock",()=>{
  if(gameStarted) message("點 PLAY 重新進入遊戲");
});

function updateHUD(){
  const w=weapon();
  document.getElementById("kills").textContent=player.kills;
  document.getElementById("healthText").textContent="HP "+Math.ceil(player.hp);
  document.getElementById("healthFill").style.width=Math.max(0,player.hp)+"%";
  document.getElementById("weaponName").textContent=w.name;
  document.getElementById("ammoNumber").textContent=w.ammo;
  document.getElementById("reserve").textContent=w.reserve;
}

let messageTimer=null;
function message(text){
  const el=document.getElementById("message");
  el.textContent=text;
  clearTimeout(messageTimer);
  if(text) messageTimer=setTimeout(()=>el.textContent="",900);
}

let hitTimer=null;
function hitMarker(){
  const el=document.getElementById("hitmarker");
  el.style.opacity="1";
  clearTimeout(hitTimer);
  hitTimer=setTimeout(()=>el.style.opacity="0",90);
}

function victory(){
  gameStarted=false;
  if(typeof controls.unlock==="function") controls.unlock();
  hud.classList.add("hidden");
  endScreen.classList.remove("hidden");
  document.getElementById("endTitle").textContent="VICTORY";
  document.getElementById("endText").textContent="你完成了本回合！";
}

function defeat(){
  gameStarted=false;
  if(typeof controls.unlock==="function") controls.unlock();
  hud.classList.add("hidden");
  endScreen.classList.remove("hidden");
  document.getElementById("endTitle").textContent="DEFEAT";
  document.getElementById("endText").textContent="你被擊敗了。";
}

document.getElementById("restart").addEventListener("click",()=>{
  enemies.forEach(e=>{e.alive=false;scene.remove(e.group);});
  enemies.length=0;
  for(let i=0;i<6;i++){
    const p=spawnPoints[i];
    createEnemy(p[0],p[1]);
  }
  player.hp=100;
  player.kills=0;
  currentWeapon=0;
  weapons[0].ammo=12; weapons[0].reserve=60;
  weapons[1].ammo=30; weapons[1].reserve=120;
  weapons[2].ammo=6; weapons[2].reserve=36;
  endScreen.classList.add("hidden");
  menu.classList.remove("hidden");
  updateHUD();
});

window.addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

function updatePlayer(delta){
  if(!gameStarted || !controls.isLocked)return;
  const speed=(keys["ShiftLeft"]||keys["ShiftRight"])?player.sprint:player.speed;
  if(keys["KeyW"])controls.moveForward(speed*delta);
  if(keys["KeyS"])controls.moveForward(-speed*delta);
  if(keys["KeyA"])controls.moveRight(-speed*delta);
  if(keys["KeyD"])controls.moveRight(speed*delta);
  player.velocityY-=20*delta;
  camera.position.y+=player.velocityY*delta;
  if(camera.position.y<=2){
    camera.position.y=2;
    player.velocityY=0;
    player.ground=true;
  }
}

let previousTime=performance.now();
function animate(){
  requestAnimationFrame(animate);
  const now=performance.now();
  const delta=Math.min((now-previousTime)/1000,.05);
  previousTime=now;
  updatePlayer(delta);
  if(gameStarted) updateEnemies(delta);
  renderer.render(scene,camera);
}

updateHUD();
updateArsenalUI();
animate();

</script>
</body>
</html>
